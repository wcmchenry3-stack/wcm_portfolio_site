version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Narrow groups first — Dependabot assigns a dependency to the first
      # group it matches, so these keep their identity.
      dev-tooling:
        patterns:
          - '@lhci/*'
          - '@size-limit/*'
          - 'size-limit'
          - 'eslint*'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'vite'
          - '@vitejs/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react*'
      i18n:
        patterns:
          - 'i18next*'
          - 'react-i18next'
      # CVE fixes get their own PR so they are never held up behind a routine batch.
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      # Anything not claimed above batches into one weekly PR; majors still
      # open individually.
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
