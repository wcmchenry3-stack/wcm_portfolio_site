# Contact form Worker — see README.md for one-time setup.
name = "contact-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Same-origin route, so the site's CSP (connect-src 'self') already allows it.
routes = [
  { pattern = "billmchenry.org/api/contact", zone_name = "billmchenry.org" },
  { pattern = "www.billmchenry.org/api/contact", zone_name = "billmchenry.org" },
]

[vars]
ALLOWED_ORIGINS = "https://billmchenry.org,https://www.billmchenry.org"
CONTACT_FROM = "contact@billmchenry.org"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f1b9172029584091b4b5bbaa08545660" # CONTACT_RATE_LIMIT_KV

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   CONTACT_TO        recipient address (your inbox)
#   TURNSTILE_SECRET  Turnstile widget secret key
#   RESEND_API_KEY    Resend send-only API key (resend.com)
